name: Release တီၢ်လိကညီကျိာ်

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: telilikaren-windows
          path: dist/*
      - name: Publish Windows release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: တီၢ်လိကညီကျိာ် ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: telilikaren-macos
          path: dist/*
      - name: Publish macOS release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: တီၢ်လိကညီကျိာ် ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
